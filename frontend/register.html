<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud A | Регистрация</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/api.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-3">
                <i class="fas fa-cloud text-white text-xl"></i>
            </div>
            <h1 class="text-2xl font-semibold text-gray-800">Регистрация</h1>
            <p class="text-gray-500 text-sm mt-1">Создайте новый аккаунт</p>
        </div>

        <form id="register-form" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-medium mb-1">Email</label>
                <input type="email" id="email" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-medium mb-1">Имя пользователя</label>
                <input type="text" id="username" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-medium mb-1">Пароль</label>
                <input type="password" id="password" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg transition">Зарегистрироваться</button>
        </form>
        
        <p class="text-center text-gray-500 text-sm mt-4">
            Уже есть аккаунт? <a href="login.html" class="text-blue-600 hover:underline">Войти</a>
        </p>
    </div>

    <script>
        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const result = await apiRequest('/auth/register', 'POST', { email, username, password });
                alert('Регистрация успешна! Теперь войдите.');
                window.location.href = 'login.html';
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        };
    </script>
</body>
</html>
