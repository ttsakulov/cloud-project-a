<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud A | Создать сервер</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script>
        // Проверка авторизации
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }
    </script>

    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <div class="logo-icon">
                    <i class="fas fa-cloud"></i>
                </div>
                <a href="index.html" class="logo-text">Cloud A</a>
            </div>
            <a href="index.html" class="nav-back">
                <i class="fas fa-arrow-left"></i> Назад
            </a>
        </div>
    </nav>

    <main class="container">
        <div class="form-container">
            <div class="form-header">
                <h1>Создание сервера</h1>
                <p>Настройте параметры вашего нового сервера</p>
            </div>

            <form id="create-form" class="server-form">
                <div class="form-group">
                    <label>Имя сервера <span>(опционально)</span></label>
                    <input type="text" id="name" placeholder="Оставьте пустым для автогенерации">
                </div>

                <div class="form-group">
                    <label>Стек / Шаблон</label>
                    <select id="template">
                        <option value="">Загрузка стеков...</option>
                    </select>
                    <p id="template-desc" class="form-hint"></p>
                </div>

                <div class="form-group">
                    <label>CPU (ядра)</label>
                    <div class="range-wrapper">
                        <input type="range" id="cores" min="2" max="8" step="2" value="2">
                        <span id="cores-value" class="range-value">2</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>RAM (ГБ)</label>
                    <div class="range-wrapper">
                        <input type="range" id="memory" min="2" max="16" step="2" value="4">
                        <span id="memory-value" class="range-value">4</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Диск (ГБ)</label>
                    <div class="range-wrapper">
                        <input type="range" id="disk" min="20" max="100" step="10" value="20">
                        <span id="disk-value" class="range-value">20</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>SSH публичный ключ <span class="required">*</span></label>
                    <textarea id="ssh_key" rows="3" placeholder="ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQ..."></textarea>
                    <div class="form-hint">
                        <i class="fas fa-info-circle"></i>
                        <button type="button" onclick="showSshHelp()" class="link-btn">Как получить SSH ключ?</button>
                    </div>
                </div>

                <button type="submit" class="btn-primary btn-block">
                    <i class="fas fa-play"></i> Создать сервер
                </button>
            </form>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        const coresSlider = document.getElementById('cores');
        const memorySlider = document.getElementById('memory');
        const diskSlider = document.getElementById('disk');
        const coresValue = document.getElementById('cores-value');
        const memoryValue = document.getElementById('memory-value');
        const diskValue = document.getElementById('disk-value');

        coresSlider.oninput = () => coresValue.textContent = coresSlider.value;
        memorySlider.oninput = () => memoryValue.textContent = memorySlider.value;
        diskSlider.oninput = () => diskValue.textContent = diskSlider.value;

        async function loadTemplates() {
            const select = document.getElementById('template');
            const descSpan = document.getElementById('template-desc');

            try {
                const templates = await apiRequest('/servers/templates');
                
                if (!templates || templates.length === 0) {
                    select.innerHTML = '<option value="">Нет доступных стеков</option>';
                    return;
                }

                select.innerHTML = '<option value="">📦 Выберите стек...</option>';

                for (const t of templates) {
                    const option = document.createElement('option');
                    option.value = t.file.replace('.yml', '');
                    option.textContent = t.name;
                    option.dataset.desc = t.description || 'Описание отсутствует';
                    select.appendChild(option);
                }

                select.onchange = () => {
                    const selected = select.options[select.selectedIndex];
                    descSpan.innerHTML = selected && selected.value ? `<i class="fas fa-cube"></i> ${selected.dataset.desc}` : '';
                };
            } catch (error) {
                select.innerHTML = '<option value="">Ошибка загрузки стеков</option>';
                console.error(error);
            }
        }

        document.getElementById('create-form').onsubmit = async (e) => {
            e.preventDefault();

            const template = document.getElementById('template').value;
            const sshKey = document.getElementById('ssh_key').value;
            const btn = e.target.querySelector('button[type="submit"]');

            if (!template) {
                alert('Пожалуйста, выберите стек');
                return;
            }
            if (!sshKey) {
                alert('Введите SSH публичный ключ');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Создание...';

            const data = {
                template: template,
                cores: parseInt(coresSlider.value),
                memory: parseInt(memorySlider.value),
                disk_size: parseInt(diskSlider.value),
                ssh_public_key: sshKey
            };
            const name = document.getElementById('name').value;
            if (name) data.name = name;

            try {
                const result = await apiRequest('/servers', 'POST', data);
                if (result && result.id) {
                    window.location.href = `index.html?new_server=${result.id}`;
                } else {
                    alert('Ошибка при создании сервера');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-play"></i> Создать сервер';
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-play"></i> Создать сервер';
            }
        };

        function showSshHelp() {
            alert(
                "Как получить SSH ключ:\n\n" +
                "1. Откройте терминал\n" +
                "2. Выполните: ssh-keygen -t rsa -b 4096\n" +
                "3. Нажимайте Enter (оставьте всё по умолчанию)\n" +
                "4. Скопируйте публичный ключ: cat ~/.ssh/id_rsa.pub\n" +
                "5. Вставьте скопированный ключ в поле выше"
            );
        }

        loadTemplates();
    </script>
</body>
</html>
