<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud A | Детали сервера</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script>
        // Проверка авторизации
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }
    </script>

    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <div class="logo-icon">
                    <i class="fas fa-cloud"></i>
                </div>
                <a href="index.html" class="logo-text">Cloud A</a>
            </div>
            <a href="index.html" class="nav-back">
                <i class="fas fa-arrow-left"></i> Назад
            </a>
        </div>
    </nav>

    <main class="container">
        <div id="loading" class="loading-state">
            <div class="spinner"></div>
            <p>Загрузка информации...</p>
        </div>

        <div id="content" class="server-detail hidden">
            <div class="detail-card">
                <div class="detail-header">
                    <div class="server-icon large">
                        <i class="fas fa-server"></i>
                    </div>
                    <div class="detail-title">
                        <h1 id="server-name"></h1>
                        <span id="server-status" class="status-badge"></span>
                    </div>
                </div>

                <div class="detail-grid">
                    <div class="detail-item">
                        <label>ID сервера</label>
                        <p id="server-id"></p>
                    </div>
                    <div class="detail-item">
                        <label>Шаблон</label>
                        <p id="server-template"></p>
                    </div>
                    <div class="detail-item">
                        <label>IP адрес</label>
                        <p id="server-ip"></p>
                        <a id="server-link" href="#" target="_blank" class="link-icon"><i class="fas fa-external-link-alt"></i> Открыть</a>
                    </div>
                    <div class="detail-item">
                        <label>Создан</label>
                        <p id="server-created"></p>
                    </div>
                </div>
            </div>

            <div class="detail-card">
                <h2><i class="fas fa-terminal"></i> SSH Доступ</h2>
                <div class="copy-wrapper">
                    <code id="ssh-command"></code>
                    <button onclick="copyToClipboard('ssh-command')" class="btn-icon"><i class="fas fa-copy"></i></button>
                </div>
                <p class="hint"><i class="fas fa-key"></i> Используйте ваш <code>~/.ssh/id_rsa</code> (приватный ключ)</p>
            </div>

            <div class="detail-card" id="control-card">
                <h2><i class="fas fa-cog"></i> Управление сервером</h2>
                <div class="control-buttons">
                    <button id="stop-btn" class="btn-warning" onclick="controlServer('stop')">
                        <i class="fas fa-stop"></i> Остановить
                    </button>
                    <button id="start-btn" class="btn-success" onclick="controlServer('start')" style="display: none;">
                        <i class="fas fa-play"></i> Запустить
                    </button>
                    <button id="reboot-btn" class="btn-info" onclick="controlServer('reboot')">
                        <i class="fas fa-sync-alt"></i> Перезагрузить
                    </button>
                </div>
            </div>

            <div class="danger-card">
                <h2><i class="fas fa-exclamation-triangle"></i> Опасная зона</h2>
                <p>Удаление сервера необратимо. Все данные будут потеряны.</p>
                <button onclick="deleteServer()" class="btn-danger">
                    <i class="fas fa-trash"></i> Удалить сервер
                </button>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const serverId = urlParams.get('id');
        let serverData = null;

        async function loadServer() {
            try {
                serverData = await apiRequest(`/servers/${serverId}`);

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

                document.getElementById('server-name').textContent = serverData.name;
                document.getElementById('server-id').textContent = serverData.id;
                document.getElementById('server-template').innerHTML = `<span class="badge">${serverData.template}</span>`;
                document.getElementById('server-created').textContent = new Date(serverData.created_at).toLocaleString();

                const statusConfig = getStatusConfig(serverData.status);
                const statusSpan = document.getElementById('server-status');
                statusSpan.className = `status-badge ${statusConfig.class}`;
                statusSpan.innerHTML = `${statusConfig.icon} ${statusConfig.text}`;

                const stopBtn = document.getElementById('stop-btn');
                const startBtn = document.getElementById('start-btn');
                const rebootBtn = document.getElementById('reboot-btn');

                if (serverData.status === 'running') {
                    stopBtn.style.display = 'inline-flex';
                    startBtn.style.display = 'none';
                    rebootBtn.style.display = 'inline-flex';
                } else if (serverData.status === 'stopped') {
                    stopBtn.style.display = 'none';
                    startBtn.style.display = 'inline-flex';
                    rebootBtn.style.display = 'none';
                } else {
                    stopBtn.style.display = 'none';
                    startBtn.style.display = 'none';
                    rebootBtn.style.display = 'none';
                }

                const ip = serverData.public_ip;
                const ipEl = document.getElementById('server-ip');
                const linkEl = document.getElementById('server-link');

                if (ip) {
                    ipEl.textContent = ip;
                    const link = getServiceLink(serverData.template, ip);
                    if (link) {
                        linkEl.href = link;
                        linkEl.style.display = 'inline-flex';
                    } else {
                        linkEl.style.display = 'none';
                    }
                } else {
                    ipEl.textContent = '—';
                    linkEl.style.display = 'none';
                }

                if (serverData.public_ip) {
                    document.getElementById('ssh-command').textContent = `ssh -i ~/.ssh/id_rsa ubuntu@${serverData.public_ip}`;
                }
            } catch (error) {
                document.getElementById('loading').innerHTML = '<p class="text-error">Ошибка загрузки сервера</p>';
            }
        }

        function getStatusConfig(status) {
            const configs = {
                'running': { class: 'status-running', icon: '🟢', text: 'Работает' },
                'provisioning': { class: 'status-provisioning', icon: '🔄', text: 'Настройка' },
                'creating': { class: 'status-creating', icon: '⚡', text: 'Создание' },
                'stopped': { class: 'status-stopped', icon: '⏹️', text: 'Остановлен' },
                'error': { class: 'status-error', icon: '🔴', text: 'Ошибка' }
            };
            return configs[status] || configs['error'];
        }

        function getServiceLink(template, ip) {
            const links = {
                'lemp': `http://${ip}`,
                'n8n': `http://${ip}:5678`,
                'docker': `http://${ip}:9000`,
                'ml-gpu': `http://${ip}:8888`,
                'redis': `http://${ip}:8081`
            };
            return links[template] || null;
        }

        async function controlServer(action) {
            const actionText = action === 'stop' ? 'остановить' : action === 'start' ? 'запустить' : 'перезагрузить';
            if (!confirm(`Вы уверены, что хотите ${actionText} сервер "${serverData.name}"?`)) return;

            const controlCard = document.getElementById('control-card');
            const originalHTML = controlCard.innerHTML;

            controlCard.innerHTML = `
                <div class="deleting-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>${action === 'stop' ? 'Остановка' : action === 'start' ? 'Запуск' : 'Перезагрузка'} сервера...</p>
                    <span>Это может занять до минуты</span>
                </div>
            `;

            try {
                await apiRequest(`/servers/${serverId}/${action}`, 'POST');
                showToast(`Сервер ${actionText}ен`, 'success');
                setTimeout(() => loadServer(), 2000);
            } catch (error) {
                controlCard.innerHTML = originalHTML;
                showToast('Ошибка: ' + error.message, 'error');
            }
        }

        async function deleteServer() {
            if (!confirm(`Удалить сервер "${serverData.name}"? Это действие необратимо.`)) return;

            const dangerCard = document.querySelector('.danger-card');
            const originalHTML = dangerCard.innerHTML;

            dangerCard.innerHTML = `
                <div class="deleting-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Удаление сервера...</p>
                    <span>Это может занять до минуты</span>
                </div>
            `;

            try {
                await apiRequest(`/servers/${serverId}`, 'DELETE');
                
                const checkInterval = setInterval(async () => {
                    try {
                        await apiRequest(`/servers/${serverId}`);
                    } catch (err) {
                        if (err.message === 'Not authenticated' || err.message.includes('404')) {
                            clearInterval(checkInterval);
                            window.location.href = 'index.html';
                        }
                    }
                }, 2000);
            } catch (error) {
                dangerCard.innerHTML = originalHTML;
                showToast('Ошибка: ' + error.message, 'error');
            }
        }

        function copyToClipboard(elId) {
            const text = document.getElementById(elId).textContent;
            navigator.clipboard.writeText(text);
            showToast('Скопировано!', 'success');
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        loadServer();
    </script>
</body>
</html>
