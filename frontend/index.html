<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud A | Серверы</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <div class="logo-icon">
                    <i class="fas fa-cloud"></i>
                </div>
                <span class="logo-text">Cloud A</span>
            </div>
            <a href="create.html" class="btn-primary">
                <i class="fas fa-plus"></i> Создать сервер
            </a>
        </div>
    </nav>

    <main class="container">
        <div class="page-header">
            <h1>Мои серверы</h1>
            <p>Управление вашими виртуальными серверами</p>
        </div>

        <div id="loading" class="loading-state">
            <div class="spinner"></div>
            <p>Загрузка серверов...</p>
        </div>

        <div id="servers-grid" class="servers-grid"></div>

        <div id="no-servers" class="empty-state">
            <div class="empty-icon">
                <i class="fas fa-server"></i>
            </div>
            <h3>У вас пока нет серверов</h3>
            <p>Создайте первый сервер, чтобы начать работу</p>
            <a href="create.html" class="btn-primary">Создать сервер</a>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        let refreshInterval = null;

        async function loadServers() {
            const loading = document.getElementById('loading');
            const grid = document.getElementById('servers-grid');
            const noServers = document.getElementById('no-servers');

            try {
                const response = await fetch(`${API_URL}/servers`);
                const servers = await response.json();

                loading.classList.add('hidden');

                if (!servers || servers.length === 0) {
                    noServers.classList.remove('hidden');
                    grid.classList.add('hidden');
                    return;
                }

                noServers.classList.add('hidden');
                grid.classList.remove('hidden');
                grid.innerHTML = '';

                for (const server of servers) {
                    const statusConfig = getStatusConfig(server.status);
                    const card = document.createElement('div');
                    card.className = 'server-card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="server-icon">
                                <i class="fas ${getServerIcon(server.template)}"></i>
                            </div>
                            <div class="server-info">
                                <h3>${escapeHtml(server.name)}</h3>
                                <span class="server-id">ID: ${server.id}</span>
                            </div>
                            <span class="status-badge ${statusConfig.class}">${statusConfig.icon} ${statusConfig.text}</span>
                        </div>
                        <div class="card-details">
                            <div class="detail-row">
                                <span class="detail-label">IP адрес</span>
                                ${server.public_ip ?
                            `<a href="http://${server.public_ip}" target="_blank" class="detail-link">${server.public_ip} <i class="fas fa-external-link-alt"></i></a>` :
                            '<span class="detail-value">—</span>'}
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Шаблон</span>
                                <span class="detail-value">${server.template}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Создан</span>
                                <span class="detail-value">${new Date(server.created_at).toLocaleDateString()}</span>
                            </div>
                        </div>
                        ${server.status === 'provisioning' ? `
                        <div class="progress-container">
                            <div class="progress-header">
                                <span>Настройка сервера</span>
                                <span id="progress-${server.id}" class="progress-percent">0%</span>
                            </div>
                            <div class="progress-bar-wrapper">
                                <div id="progress-bar-${server.id}" class="progress-bar-fill" style="width: 0%"></div>
                            </div>
                        </div>
                        ` : ''}
                        <div class="card-actions">
                            <button class="btn-outline" onclick="viewServer(${server.id})">
                                <i class="fas fa-eye"></i> Детали
                            </button>
                            ${server.status === 'running' ? `
                            <button class="btn-warning" onclick="controlServer(${server.id}, 'stop')">
                                <i class="fas fa-stop"></i>
                            </button>
                            <button class="btn-info" onclick="controlServer(${server.id}, 'reboot')">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                            ` : server.status === 'stopped' ? `
                            <button class="btn-success" onclick="controlServer(${server.id}, 'start')">
                                <i class="fas fa-play"></i>
                            </button>
                            ` : ''}
                            <button class="btn-danger" onclick="deleteServer(${server.id}, '${escapeHtml(server.name)}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);

                    if (server.status === 'provisioning') {
                        startProgressPolling(server.id);
                    }
                }
            } catch (error) {
                loading.classList.add('hidden');
                console.error(error);
                showToast('Ошибка загрузки серверов', 'error');
            }
        }

        function getStatusConfig(status) {
            const configs = {
                'running': { class: 'status-running', icon: '🟢', text: 'Работает' },
                'provisioning': { class: 'status-provisioning', icon: '🔄', text: 'Настройка' },
                'creating': { class: 'status-creating', icon: '⚡', text: 'Создание' },
                'stopped': { class: 'status-stopped', icon: '⏹️', text: 'Остановлен' },
                'error': { class: 'status-error', icon: '🔴', text: 'Ошибка' },
                'deleted': { class: 'status-deleted', icon: '⚫', text: 'Удалён' }
            };
            return configs[status] || configs['error'];
        }

        function getServerIcon(template) {
            const icons = {
                'lemp': 'fa-server',
                'docker': 'fa-docker',
                'ml-gpu': 'fa-brain',
                'n8n': 'fa-robot',
                'redis': 'fa-database'
            };
            return icons[template] || 'fa-server';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function startProgressPolling(serverId) {
            const pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_URL}/servers/${serverId}`);
                    const server = await response.json();

                    if (server.status === 'running') {
                        clearInterval(pollInterval);
                        loadServers();
                    } else if (server.status === 'error') {
                        clearInterval(pollInterval);
                        loadServers();
                    } else if (server.status === 'provisioning') {
                        const progressBar = document.getElementById(`progress-bar-${serverId}`);
                        const progressText = document.getElementById(`progress-${serverId}`);
                        if (progressBar) {
                            let width = parseFloat(progressBar.style.width) || 0;
                            if (width < 90) {
                                width = Math.min(width + Math.random() * 10 + 5, 90);
                                progressBar.style.width = `${width}%`;
                                if (progressText) progressText.textContent = `${Math.floor(width)}%`;
                            }
                        }
                    }
                } catch (error) {
                    console.error('Progress poll error:', error);
                }
            }, 4000);
        }

        async function controlServer(id, action) {
            const actionText = action === 'stop' ? 'остановить' : action === 'start' ? 'запустить' : 'перезагрузить';
            if (!confirm(`Вы уверены, что хотите ${actionText} сервер?`)) return;

            let targetCard = null;
            const cards = document.querySelectorAll('.server-card');
            for (const card of cards) {
                if (card.innerText.includes(`ID: ${id}`)) {
                    targetCard = card;
                    break;
                }
            }

            if (targetCard) {
                targetCard.classList.add('deleting');
                targetCard.innerHTML = `
            <div class="deleting-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>${action === 'stop' ? 'Остановка' : action === 'start' ? 'Запуск' : 'Перезагрузка'} сервера...</p>
                <span>Это может занять до минуты</span>
            </div>
        `;
            }

            try {
                const response = await fetch(`${API_URL}/servers/${id}/${action}`, { method: 'POST' });
                if (response.ok) {
                    if (action === 'reboot') {
                        showToast('Сервер перезагружается', 'success');
                        setTimeout(() => loadServers(), 3000);
                    } else {
                        showToast(`Сервер ${actionText}ен`, 'success');
                        setTimeout(() => loadServers(), 2000);
                    }
                } else {
                    if (targetCard) {
                        targetCard.classList.remove('deleting');
                        loadServers();
                    }
                    showToast('Ошибка при выполнении операции', 'error');
                }
            } catch (error) {
                if (targetCard) {
                    targetCard.classList.remove('deleting');
                    loadServers();
                }
                showToast('Ошибка: ' + error.message, 'error');
            }
        }

        async function deleteServer(id, name) {
            if (!confirm(`Удалить сервер "${name}"? Это действие необратимо.`)) return;

            let targetCard = null;
            const cards = document.querySelectorAll('.server-card');
            for (const card of cards) {
                if (card.innerText.includes(`ID: ${id}`)) {
                    targetCard = card;
                    break;
                }
            }

            if (targetCard) {
                targetCard.classList.add('deleting');
                targetCard.innerHTML = `
                    <div class="deleting-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Удаление сервера...</p>
                        <span>Это может занять до минуты</span>
                    </div>
                `;
            }

            try {
                const response = await fetch(`${API_URL}/servers/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    const checkInterval = setInterval(async () => {
                        try {
                            const checkRes = await fetch(`${API_URL}/servers/${id}`);
                            if (checkRes.status === 404) {
                                clearInterval(checkInterval);
                                if (targetCard) {
                                    targetCard.style.transition = 'opacity 0.3s ease';
                                    targetCard.style.opacity = '0';
                                    setTimeout(() => loadServers(), 300);
                                } else {
                                    loadServers();
                                }
                                showToast(`Сервер "${name}" удалён`, 'success');
                            } else {
                                const server = await checkRes.json();
                                if (server.status === 'deleted') {
                                    clearInterval(checkInterval);
                                    if (targetCard) {
                                        targetCard.style.transition = 'opacity 0.3s ease';
                                        targetCard.style.opacity = '0';
                                        setTimeout(() => loadServers(), 300);
                                    } else {
                                        loadServers();
                                    }
                                    showToast(`Сервер "${name}" удалён`, 'success');
                                }
                            }
                        } catch (err) {
                            clearInterval(checkInterval);
                            if (targetCard) {
                                targetCard.style.transition = 'opacity 0.3s ease';
                                targetCard.style.opacity = '0';
                                setTimeout(() => loadServers(), 300);
                            } else {
                                loadServers();
                            }
                            showToast(`Сервер "${name}" удалён`, 'success');
                        }
                    }, 2000);
                } else {
                    if (targetCard) {
                        targetCard.classList.remove('deleting');
                        loadServers();
                    }
                    showToast('Ошибка при удалении', 'error');
                }
            } catch (error) {
                if (targetCard) {
                    targetCard.classList.remove('deleting');
                    loadServers();
                }
                showToast('Ошибка: ' + error.message, 'error');
            }
        }

        function viewServer(id) {
            window.location.href = `server.html?id=${id}`;
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const newServerId = urlParams.get('new_server');
        if (newServerId) {
            window.history.replaceState({}, document.title, window.location.pathname);
            setTimeout(() => showToast('✅ Сервер создаётся, это займёт несколько минут', 'success'), 100);
        }

        loadServers();
        setInterval(loadServers, 15000);
    </script>
</body>

</html>
